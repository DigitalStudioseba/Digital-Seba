<style>

  .ds-theme-selector-link:hover, .ds-theme-selector-link:active { background: #e2e8f0; }
  @media (max-height: 500px) { .ds-theme-list { max-height: 200px !important; } }
  @media (max-width: 480px) { #ds-theme-switcher { bottom: max(16px, env(safe-area-inset-bottom, 16px)); left: max(16px, env(safe-area-inset-left, 16px)); } #ds-theme-button { padding: 10px 20px; font-size: 14px; } }
</style>
<div id="ds-theme-switcher">
  <button id="ds-theme-button" aria-label="Change Theme">&#127912; Theme</button>
  <div id="ds-theme-panel">
    <div class="ds-theme-header">Select Theme</div>
    <div class="ds-theme-list" id="ds-theme-list"></div>
    <a href="/theme-selector/" class="ds-theme-selector-link">&#127912; Browse All Themes</a>
  </div>
</div>

<script>
  (function() {
    var validThemes = [
        { id: 'theme-alpha', name: 'Alpha' },
        { id: 'theme-nexus', name: 'Nexus' },
        { id: 'theme-horizon', name: 'Horizon' },
        { id: 'theme-quantum', name: 'Quantum' },
        { id: 'theme-vertex', name: 'Vertex' },
        { id: 'theme-pulse', name: 'Pulse' },
        { id: 'theme-orbit', name: 'Orbit' },
        { id: 'theme-spark', name: 'Spark' },
        { id: 'theme-lumina', name: 'Lumina' },
        { id: 'theme-zenith', name: 'Zenith' },
        { id: 'theme-aero', name: 'Aero' },
        { id: 'theme-nova', name: 'Nova' },
        { id: 'theme-prism', name: 'Prism' },
        { id: 'theme-echo', name: 'Echo' },
        { id: 'theme-flux', name: 'Flux' },
        { id: 'theme-neon', name: 'Neon' },
        { id: 'theme-core', name: 'Core' },
        { id: 'theme-apex', name: 'Apex' },
        { id: 'theme-ignite', name: 'Ignite' },
        { id: 'theme-infinity', name: 'Infinity' },
        { id: 'theme-genesis', name: 'Genesis' }
    ];

    var match = window.location.pathname.match(/theme-[a-zA-Z0-9]+/);
    var currentTheme = match ? match[0] : (localStorage.getItem('activeTheme') || 'theme-alpha');

    var toggleBtn = document.getElementById('ds-theme-button');
    var panel = document.getElementById('ds-theme-panel');
    var list = document.getElementById('ds-theme-list');

    list.addEventListener('wheel', function(e) { e.stopPropagation(); }, { passive: true });
    list.addEventListener('touchmove', function(e) { e.stopPropagation(); }, { passive: true });

    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      panel.classList.toggle('ds-open');
    });

    document.addEventListener('click', function(e) {
      if (!panel.contains(e.target) && !toggleBtn.contains(e.target)) {
        panel.classList.remove('ds-open');
      }
    });

    document.addEventListener('touchstart', function(e) {
      if (!panel.contains(e.target) && !toggleBtn.contains(e.target)) {
        panel.classList.remove('ds-open');
      }
    }, { passive: true });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') panel.classList.remove('ds-open');
    });

    for (var i = 0; i < validThemes.length; i++) {
      (function(t) {
        var btn = document.createElement('button');
        var isActive = (t.id === currentTheme);
        btn.className = 'ds-theme-option' + (isActive ? ' ds-active' : '');
        btn.innerHTML = '<span>' + t.name + '</span><span class="ds-active-badge">&#10004; Active</span>';

        btn.addEventListener('click', function() {
          if (!isActive) {
            localStorage.setItem('activeTheme', t.id);
            if (t.id === 'theme-alpha') {
              window.location.href = '/';
            } else {
              var themeMap = {
                "theme-lumina": "out/index.html",
                "theme-zenith": "dist/index.html",
                "theme-aero": "dist/index.html",
                "theme-nova": "dist/index.html"
              };
              var target = themeMap[t.id] || "index.html";
              window.location.href = '/homepage-themes/' + t.id + '/' + target;
            }
          }
        });

        list.appendChild(btn);
      })(validThemes[i]);
    }
  })();
</script>
<!-- END DS LEFT THEME SWITCHER -->

</body>
</html>
